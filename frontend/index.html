<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/favIcons.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Blog</title>

    <style>
      /* ✅ Prevent white flash if there's any micro-gap before React paints */
      html, body {
        background: #f9fafb;
        margin: 0;
      }

      @media (prefers-color-scheme: dark) {
        html, body {
          background: #0f172a;
        }
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f9fafb;
        transition: opacity 0.4s ease;
      }

      @media (prefers-color-scheme: dark) {
        #initial-loader {
          background: #0f172a;
        }
      }

      .loader-spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        animation: loader-spin 0.8s linear infinite;
      }

      .loader-text {
        margin-top: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #6b7280;
      }

      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #initial-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="initial-loader">
      <div class="loader-spinner"></div>
      <p class="loader-text">Loading My Blog...</p>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
